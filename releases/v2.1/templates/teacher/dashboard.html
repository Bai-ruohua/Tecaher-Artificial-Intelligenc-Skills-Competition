<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师仪表盘 - {{ config.COURSE_NAME }}AI智能教学平台</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
.metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.metric-card { background: var(--bg-secondary); border-radius: 8px; padding: 16px; }
.metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.metric-value { font-size: 24px; font-weight: 600; color: var(--text-primary); }
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.chart-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.chart-wrap { position: relative; height: 320px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { font-weight: 500; color: var(--text-secondary); background: var(--bg-secondary); }
.rank-badge { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 12px; font-weight: 600; }
.rank-1 { background: #FFD700; color: #333; }
.rank-2 { background: #C0C0C0; color: #333; }
.rank-3 { background: #CD7F32; color: #fff; }
.rank-other { background: var(--bg-tertiary); color: var(--text-secondary); }
.gantt-bar { display: inline-block; height: 20px; border-radius: 4px; vertical-align: middle; }
.gantt-mastered { background: #1D9E75; }
.gantt-progress { background: #378ADD; }
.gantt-weak { background: #EF9F27; }
.gantt-vweak { background: #E24B4A; }
.gantt-none { background: #ddd; }
</style>
</head>
<body>
<nav class="navbar">
  <a href="/teacher/dashboard" class="navbar-brand">{{ config.SCHOOL_NAME }} · 教师工作台</a>
  <div class="navbar-nav">
    <a href="/teacher/dashboard" class="nav-link">仪表盘</a>
    <a href="/teacher/lesson-prep" class="nav-link">备课</a>
    <a href="/teacher/exam" class="nav-link">命题</a>
    <a href="/teacher/grading" class="nav-link">批改</a>
    <a href="/teacher/analytics" class="nav-link">学情</a>
    <a href="/teacher/students" class="nav-link">学生管理</a>
    <span style="font-size:13px;color:var(--text-secondary);margin:0 8px">{{ teacher.teacher_name }}</span>
    <a href="/logout" class="nav-link" style="color:var(--danger)">退出</a>
  </div>
</nav>

<div class="container">
  <h2 style="margin-bottom:8px;font-size:20px">教师仪表盘</h2>
  <p style="color:var(--text-secondary);margin-bottom:20px">
    <select id="courseFilter" onchange="loadDashboard()" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px">
      <option value="">全部课程</option>
      {% for c in courses %}
      <option value="{{ c.id }}">{{ c.course_name }}{% if c.semester %} ({{ c.semester }}){% endif %}</option>
      {% endfor %}
    </select>
  </p>

  <div class="metric-row">
    <div class="metric-card"><div class="metric-label">学生总数</div><div class="metric-value" id="m-total">-</div></div>
    <div class="metric-card"><div class="metric-label">活跃学生</div><div class="metric-value" id="m-active">-</div></div>
    <div class="metric-card"><div class="metric-label">平均正确率</div><div class="metric-value" id="m-accuracy">-</div></div>
    <div class="metric-card"><div class="metric-label">平均综合分</div><div class="metric-value" id="m-composite">-</div></div>
  </div>

  <div class="dashboard-grid">
    <div class="chart-card">
      <div class="chart-title">班级能力雷达图</div>
      <div class="chart-wrap"><canvas id="radarChart" role="img" aria-label="班级能力雷达图"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">知识点掌握甘特图</div>
      <div id="ganttChart" style="height:320px;overflow-y:auto"></div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">学生排名榜</div>
    <table id="rankTable">
      <thead><tr><th>排名</th><th>学号</th><th>姓名</th><th>班级</th><th>答题数</th><th>正确率</th><th>平均分</th><th>学习时长</th><th>错题数</th><th>综合分</th></tr></thead>
      <tbody id="rankBody"><tr><td colspan="10" style="text-align:center;color:var(--text-tertiary)">加载中...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
async function loadDashboard() {
  const courseId = document.getElementById('courseFilter').value;
  const url = '/api/teacher/dashboard' + (courseId ? '?course_id=' + courseId : '');

  try {
    const resp = await fetch(url);
    const json = await resp.json();
    if (!json.success) return;
    const d = json.data;

    document.getElementById('m-total').textContent = d.summary.total_students;
    document.getElementById('m-active').textContent = d.summary.active_students;
    document.getElementById('m-accuracy').textContent = d.summary.avg_accuracy + '%';
    document.getElementById('m-composite').textContent = d.summary.avg_composite;

    renderRadar(d.class_radar);
    renderGantt(d.class_gantt);
    renderRankings(d.rankings);
  } catch(e) {
    console.error('Dashboard load error:', e);
  }
}

function renderRadar(radar) {
  const ctx = document.getElementById('radarChart');
  if (window._radarChart) window._radarChart.destroy();

  window._radarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: radar.map(r => r.label),
      datasets: [{
        label: '班级平均',
        data: radar.map(r => r.score),
        backgroundColor: 'rgba(55, 138, 221, 0.15)',
        borderColor: 'rgba(55, 138, 221, 0.8)',
        borderWidth: 2,
        pointBackgroundColor: 'rgba(55, 138, 221, 1)',
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { r: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 11 } }, pointLabels: { font: { size: 12 } } } },
      plugins: { legend: { display: false } }
    }
  });
}

function renderGantt(gantt) {
  const container = document.getElementById('ganttChart');
  if (!gantt || gantt.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-tertiary);padding:40px">暂无数据</div>';
    return;
  }

  const levelClass = { mastered: 'gantt-mastered', in_progress: 'gantt-progress', weak: 'gantt-weak', very_weak: 'gantt-vweak', not_started: 'gantt-none' };
  const levelLabel = { mastered: '已掌握', in_progress: '进行中', weak: '薄弱', very_weak: '很弱', not_started: '未开始' };

  let html = '<table><thead><tr><th>章节</th><th>掌握度</th><th>状态</th><th>答题量</th></tr></thead><tbody>';
  for (const g of gantt) {
    const cls = levelClass[g.mastery_level] || 'gantt-none';
    const label = levelLabel[g.mastery_level] || '-';
    html += `<tr>
      <td style="font-size:12px">${g.chapter_title}</td>
      <td><div class="gantt-bar ${cls}" style="width:${g.mastery_percent}%"></div> ${g.mastery_percent}%</td>
      <td style="font-size:12px">${label}</td>
      <td style="font-size:12px">${g.total_attempts}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderRankings(rankings) {
  const tbody = document.getElementById('rankBody');
  if (!rankings || rankings.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-tertiary)">暂无学生数据，请先创建学生账号</td></tr>';
    return;
  }

  let html = '';
  for (const r of rankings) {
    const rankCls = r.rank === 1 ? 'rank-1' : r.rank === 2 ? 'rank-2' : r.rank === 3 ? 'rank-3' : 'rank-other';
    html += `<tr>
      <td><span class="rank-badge ${rankCls}">${r.rank}</span></td>
      <td>${r.student_no}</td>
      <td>${r.student_name}</td>
      <td>${r.class_name || '-'}</td>
      <td>${r.total_attempts}</td>
      <td>${r.accuracy}%</td>
      <td>${r.avg_score}</td>
      <td>${r.study_minutes}min</td>
      <td>${r.wrong_count}</td>
      <td style="font-weight:600;color:var(--primary)">${r.composite_score}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

loadDashboard();
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
